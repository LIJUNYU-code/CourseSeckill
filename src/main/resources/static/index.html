<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CourseSeckill · 高并发选课</title>
<style>
  :root {
    --bg: #0a0a0c;
    --surface: #14141a;
    --surface-2: #1c1c24;
    --border: #2a2a35;
    --text: #e8e8ee;
    --text-dim: #8b8b9a;
    --accent: #0a84ff;
    --accent-hover: #409cff;
    --green: #30d158;
    --red: #ff453a;
    --orange: #ff9f0a;
    --radius: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: radial-gradient(ellipse at top, #16161f 0%, var(--bg) 55%);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    font-size: 14px;
    font-weight: 550;
    transition: all 0.16s ease;
  }

  button:disabled { opacity: 0.45; cursor: not-allowed; }

  input {
    font-family: inherit;
    font-size: 15px;
    width: 100%;
    padding: 13px 15px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    outline: none;
    transition: border-color 0.16s;
  }

  input:focus { border-color: var(--accent); }
  input::placeholder { color: var(--text-dim); }

  /* ---------- 登录页 ---------- */
  #login-view {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }

  .login-card {
    width: 100%;
    max-width: 400px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px 36px;
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
  }

  .brand {
    font-size: 25px;
    font-weight: 680;
    letter-spacing: -0.5px;
    margin-bottom: 6px;
  }

  .brand span { color: var(--accent); }

  .brand-sub {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 30px;
    line-height: 1.6;
  }

  .field { margin-bottom: 15px; }
  .field label {
    display: block;
    font-size: 12.5px;
    color: var(--text-dim);
    margin-bottom: 7px;
    font-weight: 550;
  }

  .btn-primary {
    width: 100%;
    padding: 13px;
    background: var(--accent);
    color: #fff;
    border-radius: 10px;
    margin-top: 8px;
  }

  .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }

  .hint {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
    line-height: 1.9;
  }

  .hint code {
    background: var(--surface-2);
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 11.5px;
    color: var(--text);
  }

  /* ---------- 主界面 ---------- */
  #app-view { display: none; }

  header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(10, 10, 12, 0.82);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-bottom: 1px solid var(--border);
  }

  .header-inner {
    max-width: 1180px;
    margin: 0 auto;
    padding: 15px 26px;
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .header-brand {
    font-size: 17px;
    font-weight: 660;
    letter-spacing: -0.3px;
  }

  .header-brand span { color: var(--accent); }

  .tabs { display: flex; gap: 4px; margin-left: 14px; }

  .tab {
    padding: 7px 15px;
    border-radius: 8px;
    background: transparent;
    color: var(--text-dim);
    font-weight: 550;
  }

  .tab:hover { color: var(--text); background: var(--surface-2); }
  .tab.active { color: var(--text); background: var(--surface-2); }

  .header-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 13px;
    color: var(--text-dim);
  }

  .who { display: flex; align-items: center; gap: 8px; }

  .avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: linear-gradient(135deg, #0a84ff, #5e5ce6);
    display: grid;
    place-items: center;
    font-size: 12.5px;
    font-weight: 700;
    color: #fff;
  }

  .btn-ghost {
    padding: 7px 14px;
    background: var(--surface-2);
    color: var(--text-dim);
    border-radius: 8px;
    border: 1px solid var(--border);
  }

  .btn-ghost:hover { color: var(--text); border-color: #3a3a48; }

  main {
    max-width: 1180px;
    margin: 0 auto;
    padding: 30px 26px 70px;
  }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 22px;
    flex-wrap: wrap;
  }

  .page-title { font-size: 21px; font-weight: 650; letter-spacing: -0.3px; }

  .stat {
    font-size: 12.5px;
    color: var(--text-dim);
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 20px;
  }

  .stat b { color: var(--text); font-weight: 620; }

  .toolbar-spacer { margin-left: auto; }

  /* ---------- 课程卡片 ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(282px, 1fr));
    gap: 16px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    display: flex;
    flex-direction: column;
    transition: border-color 0.18s, transform 0.18s;
  }

  .card:hover { border-color: #3a3a48; transform: translateY(-2px); }

  .card-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 4px;
  }

  .card-title {
    font-size: 16px;
    font-weight: 620;
    letter-spacing: -0.2px;
  }

  .card-teacher { font-size: 12.5px; color: var(--text-dim); margin-bottom: 16px; }

  .credit {
    font-size: 11.5px;
    color: var(--text-dim);
    background: var(--surface-2);
    padding: 3px 9px;
    border-radius: 6px;
    white-space: nowrap;
  }

  /* 进度条 */
  .bar-wrap { margin-bottom: 16px; }

  .bar-label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 7px;
  }

  .bar-label b { color: var(--text); }

  .bar {
    height: 5px;
    background: var(--surface-2);
    border-radius: 3px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1), background 0.3s;
    width: 0%;
  }

  .bar-fill.few { background: var(--orange); }
  .bar-fill.none { background: var(--red); }

  .btn-seckill {
    width: 100%;
    padding: 11px;
    border-radius: 9px;
    background: var(--accent);
    color: #fff;
    margin-top: auto;
  }

  .btn-seckill:hover:not(:disabled) { background: var(--accent-hover); }
  .btn-seckill.done { background: var(--surface-2); color: var(--green); }
  .btn-seckill.soldout { background: var(--surface-2); color: var(--text-dim); }
  .btn-seckill.pending { background: var(--surface-2); color: var(--orange); }

  /* ---------- 订单列表 ---------- */
  .orders { display: flex; flex-direction: column; gap: 10px; }

  .order {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 17px 20px;
    display: flex;
    align-items: center;
    gap: 18px;
  }

  .order-main { flex: 1; min-width: 0; }

  .order-name { font-size: 15px; font-weight: 600; margin-bottom: 5px; }

  .order-no {
    font-size: 11.5px;
    color: var(--text-dim);
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .badge {
    font-size: 12px;
    font-weight: 600;
    padding: 5px 12px;
    border-radius: 20px;
    white-space: nowrap;
  }

  .badge.success { background: rgba(48, 209, 88, 0.13); color: var(--green); }
  .badge.pending { background: rgba(255, 159, 10, 0.13); color: var(--orange); }
  .badge.failed  { background: rgba(255, 69, 58, 0.13); color: var(--red); }
  .badge.cancel  { background: var(--surface-2); color: var(--text-dim); }

  .btn-small {
    padding: 7px 15px;
    border-radius: 8px;
    background: var(--surface-2);
    color: var(--text-dim);
    border: 1px solid var(--border);
    font-size: 13px;
  }

  .btn-small:hover:not(:disabled) { color: var(--red); border-color: rgba(255, 69, 58, 0.4); }

  .empty {
    text-align: center;
    padding: 70px 20px;
    color: var(--text-dim);
    font-size: 14px;
  }

  /* ---------- 提示条 ---------- */
  #toasts {
    position: fixed;
    top: 22px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 999;
    display: flex;
    flex-direction: column;
    gap: 9px;
    align-items: center;
    pointer-events: none;
  }

  .toast {
    padding: 11px 20px;
    border-radius: 10px;
    font-size: 13.5px;
    font-weight: 550;
    background: var(--surface-2);
    border: 1px solid var(--border);
    box-shadow: 0 10px 34px rgba(0, 0, 0, 0.45);
    animation: slide-in 0.24s ease;
    max-width: 90vw;
  }

  .toast.ok { border-color: rgba(48, 209, 88, 0.4); color: var(--green); }
  .toast.err { border-color: rgba(255, 69, 58, 0.4); color: var(--red); }

  @keyframes slide-in {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .spinner {
    width: 15px;
    height: 15px;
    border: 2px solid rgba(255, 255, 255, 0.28);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: inline-block;
    vertical-align: -2px;
    margin-right: 7px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 620px) {
    .header-inner { padding: 13px 16px; gap: 10px; flex-wrap: wrap; }
    .tabs { margin-left: 0; order: 3; width: 100%; }
    main { padding: 20px 16px 60px; }
    .grid { grid-template-columns: 1fr; }
    .order { flex-wrap: wrap; gap: 12px; }
    .who span { display: none; }
  }
</style>
</head>
<body>

<!-- ==================== 登录 ==================== -->
<div id="login-view">
  <div class="login-card">
    <div class="brand">Course<span>Seckill</span></div>
    <div class="brand-sub">高并发选课引擎 —— 100 个名额，300 人同时抢</div>

    <form id="login-form">
      <div class="field">
        <label for="account">账号</label>
        <input id="account" placeholder="学号或 admin" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input id="password" type="password" placeholder="密码" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-primary" id="login-btn">登录</button>
    </form>

    <div class="hint">
      演示账号<br>
      学生 <code>S000000001</code> / <code>Abc12345</code><br>
      管理员 <code>admin</code> / <code>Demo@2026</code>
    </div>
  </div>
</div>

<!-- ==================== 主界面 ==================== -->
<div id="app-view">
  <header>
    <div class="header-inner">
      <div class="header-brand">Course<span>Seckill</span></div>
      <div class="tabs">
        <button class="tab active" data-tab="courses">课程</button>
        <button class="tab" data-tab="orders">我的选课</button>
      </div>
      <div class="header-right">
        <div class="who">
          <div class="avatar" id="avatar">?</div>
          <span id="who-name"></span>
        </div>
        <button class="btn-ghost" id="logout-btn">退出</button>
      </div>
    </div>
  </header>

  <main>
    <!-- 课程页 -->
    <section id="tab-courses">
      <div class="toolbar">
        <div class="page-title">全部课程</div>
        <div class="stat">共 <b id="stat-total">0</b> 门</div>
        <div class="stat">可抢 <b id="stat-open">0</b> 门</div>
        <div class="toolbar-spacer"></div>
        <button class="btn-ghost" id="admin-preheat" style="display:none">预热全部库存</button>
        <button class="btn-ghost" id="refresh-courses">刷新</button>
      </div>
      <div class="grid" id="course-grid"></div>
      <div class="empty" id="course-empty" style="display:none">加载中…</div>
    </section>

    <!-- 订单页 -->
    <section id="tab-orders" style="display:none">
      <div class="toolbar">
        <div class="page-title">我的选课</div>
        <div class="stat">共 <b id="stat-orders">0</b> 条</div>
        <div class="toolbar-spacer"></div>
        <button class="btn-ghost" id="refresh-orders">刷新</button>
      </div>
      <div class="orders" id="order-list"></div>
      <div class="empty" id="order-empty" style="display:none">
        还没有选课记录，去「课程」页抢一门吧
      </div>
    </section>
  </main>
</div>

<div id="toasts"></div>

<script>
(function () {
  'use strict';

  // ==================== 状态 ====================
  var state = {
    token: sessionStorage.getItem('cs_token') || '',
    role: sessionStorage.getItem('cs_role') || '',
    name: sessionStorage.getItem('cs_name') || '',
    account: sessionStorage.getItem('cs_account') || '',
    courses: [],
    orders: [],
    busyCourseId: null
  };

  var statusText = { 0: '待处理', 1: '已成功', 2: '已失败', 3: '已退课' };
  var statusClass = { 0: 'pending', 1: 'success', 2: 'failed', 3: 'cancel' };

  // ==================== 工具 ====================
  function $(id) { return document.getElementById(id); }

  function el(tag, className, text) {
    var n = document.createElement(tag);
    if (className) n.className = className;
    if (text !== undefined && text !== null) n.textContent = text;
    return n;
  }

  function toast(message, kind) {
    var box = el('div', 'toast ' + (kind || ''), message);
    $('toasts').appendChild(box);
    setTimeout(function () {
      box.style.transition = 'opacity .3s, transform .3s';
      box.style.opacity = '0';
      box.style.transform = 'translateY(-8px)';
      setTimeout(function () { box.remove(); }, 320);
    }, 2600);
  }

  // 统一请求：自动带 token、自动处理 401
  function api(path, options) {
    options = options || {};
    var headers = { 'Content-Type': 'application/json' };
    if (state.token) headers['Authorization'] = 'Bearer ' + state.token;

    return fetch(path, {
      method: options.method || 'GET',
      headers: headers,
      body: options.body ? JSON.stringify(options.body) : undefined
    }).then(function (res) {
      return res.json().catch(function () {
        throw new Error('服务器返回了非 JSON 内容（HTTP ' + res.status + '）');
      }).then(function (data) {
        if (res.status === 401) {
          logout();
          throw new Error('登录已过期，请重新登录');
        }
        if (data.code !== 200) {
          throw new Error(data.message || ('请求失败（' + data.code + '）'));
        }
        return data.data;
      });
    });
  }

  function saveSession(payload) {
    state.token = payload.token;
    state.role = payload.role;
    state.name = payload.realName;
    state.account = payload.username;
    sessionStorage.setItem('cs_token', payload.token);
    sessionStorage.setItem('cs_role', payload.role);
    sessionStorage.setItem('cs_name', payload.realName);
    sessionStorage.setItem('cs_account', payload.username);
  }

  function logout() {
    state.token = state.role = state.name = state.account = '';
    state.courses = [];
    state.orders = [];
    sessionStorage.clear();
    $('app-view').style.display = 'none';
    $('login-view').style.display = 'flex';
  }

  // ==================== 登录 ====================
  $('login-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = $('login-btn');
    var account = $('account').value.trim();
    var password = $('password').value;

    if (!account || !password) {
      toast('请输入账号和密码', 'err');
      return;
    }

    btn.disabled = true;
    btn.textContent = '登录中…';

    api('/api/auth/login', {
      method: 'POST',
      body: { account: account, password: password }
    }).then(function (data) {
      saveSession(data);
      enterApp();
      toast('欢迎回来，' + data.realName, 'ok');
    }).catch(function (err) {
      toast(err.message, 'err');
    }).finally(function () {
      btn.disabled = false;
      btn.textContent = '登录';
    });
  });

  $('logout-btn').addEventListener('click', logout);

  // ==================== 进入主界面 ====================
  function enterApp() {
    $('login-view').style.display = 'none';
    $('app-view').style.display = 'block';
    $('avatar').textContent = (state.name || '?').slice(0, 1);
    $('who-name').textContent = state.name || state.account;
    $('admin-preheat').style.display = state.role === 'ADMIN' ? '' : 'none';

    // 管理员没有学生选课接口的权限，默认落到课程页
    switchTab('courses');
    loadCourses();
    if (state.role === 'STUDENT') loadOrders();
  }

  // ==================== Tab ====================
  function switchTab(name) {
    document.querySelectorAll('.tab').forEach(function (t) {
      t.classList.toggle('active', t.dataset.tab === name);
    });
    $('tab-courses').style.display = name === 'courses' ? '' : 'none';
    $('tab-orders').style.display = name === 'orders' ? '' : 'none';
    if (name === 'orders' && state.role === 'STUDENT') loadOrders();
    if (name === 'courses') loadCourses();
  }

  document.querySelectorAll('.tab').forEach(function (t) {
    t.addEventListener('click', function () { switchTab(t.dataset.tab); });
  });

  // ==================== 课程 ====================
  function loadCourses() {
    api('/api/course').then(function (list) {
      state.courses = list || [];
      renderCourses();
    }).catch(function (err) {
      $('course-empty').textContent = err.message;
      $('course-empty').style.display = 'block';
    });
  }

  function renderCourses() {
    var grid = $('course-grid');
    grid.innerHTML = '';

    var open = 0;
    state.courses.forEach(function (c) {
      if (c.stock > 0 && c.myOrderStatus !== 1 && c.myOrderStatus !== 0) open++;
    });
    $('stat-total').textContent = state.courses.length;
    $('stat-open').textContent = open;

    if (!state.courses.length) {
      $('course-empty').textContent = '暂无课程';
      $('course-empty').style.display = 'block';
      return;
    }
    $('course-empty').style.display = 'none';

    state.courses.forEach(function (c) { grid.appendChild(courseCard(c)); });
  }

  function courseCard(c) {
    var card = el('div', 'card');

    var head = el('div', 'card-head');
    head.appendChild(el('div', 'card-title', c.courseName));
    head.appendChild(el('div', 'credit', (c.credit != null ? c.credit : '-') + ' 学分'));
    card.appendChild(head);
    card.appendChild(el('div', 'card-teacher', c.teacher || ''));

    // 进度条：已选 / 总名额
    var percent = c.capacity > 0 ? (c.sold / c.capacity) * 100 : 100;
    var wrap = el('div', 'bar-wrap');
    var label = el('div', 'bar-label');
    label.appendChild(el('span', null, '剩余 ' + c.stock + ' / ' + c.capacity));
    label.appendChild(el('span', null, '已选 ' + c.sold));
    wrap.appendChild(label);

    var bar = el('div', 'bar');
    var fill = el('div', 'bar-fill');
    fill.style.width = Math.min(100, percent) + '%';
    if (c.stock === 0) fill.classList.add('none');
    else if (c.stock <= 10) fill.classList.add('few');
    bar.appendChild(fill);
    wrap.appendChild(bar);
    card.appendChild(wrap);

    // 按钮：按订单状态决定文案
    var btn = el('button', 'btn-seckill');
    var status = c.myOrderStatus;

    if (status === 1) {
      btn.textContent = '已选上';
      btn.classList.add('done');
      btn.disabled = true;
    } else if (status === 0) {
      btn.textContent = '排队中…';
      btn.classList.add('pending');
      btn.disabled = true;
    } else if (c.stock === 0) {
      btn.textContent = '名额已满';
      btn.classList.add('soldout');
      btn.disabled = true;
    } else if (state.role !== 'STUDENT') {
      btn.textContent = '仅学生可选';
      btn.classList.add('soldout');
      btn.disabled = true;
    } else {
      btn.textContent = status === 3 ? '重新选课' : '立即抢课';
      btn.addEventListener('click', function () { doSeckill(c.courseId, btn); });
    }

    card.appendChild(btn);
    return card;
  }

  function doSeckill(courseId, btn) {
    if (state.busyCourseId) return;
    state.busyCourseId = courseId;

    var original = btn.textContent;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>抢课中';

    api('/api/seckill/' + courseId, { method: 'POST' })
      .then(function () {
        // v3 语义：HTTP 200 只代表"已受理入队"，订单仍是 0 待处理。
        // 所以这里不能直接说"选课成功"，要去看真实状态。
        toast('已提交，正在排队落单…', 'ok');
        pollOrderStatus(courseId, 0);
      })
      .catch(function (err) {
        toast(err.message, 'err');
        btn.disabled = false;
        btn.textContent = original;
      })
      .finally(function () {
        state.busyCourseId = null;
        loadCourses();
      });
  }

  // 轮询单门课的订单状态：0 待处理 → 1 成功 / 2 失败
  function pollOrderStatus(courseId, attempt) {
    if (attempt >= 10) return;
    setTimeout(function () {
      api('/api/course/' + courseId).then(function (c) {
        if (c.myOrderStatus === 0) {
          pollOrderStatus(courseId, attempt + 1);
        } else if (c.myOrderStatus === 1) {
          toast('选课成功：' + c.courseName, 'ok');
          loadCourses();
          if (state.role === 'STUDENT') loadOrders();
        } else if (c.myOrderStatus === 2) {
          toast('选课失败，名额已被抢完', 'err');
          loadCourses();
          if (state.role === 'STUDENT') loadOrders();
        }
      }).catch(function () { /* 轮询失败静默重试 */ });
    }, 400);
  }

  // ==================== 订单 ====================
  function loadOrders() {
    if (state.role !== 'STUDENT') return;
    api('/api/order/my?page=1&size=50').then(function (page) {
      state.orders = (page && page.records) || [];
      renderOrders(page ? page.total : 0);
    }).catch(function (err) {
      toast(err.message, 'err');
    });
  }

  function renderOrders(total) {
    var list = $('order-list');
    list.innerHTML = '';
    $('stat-orders').textContent = total || state.orders.length;

    if (!state.orders.length) {
      $('order-empty').style.display = 'block';
      return;
    }
    $('order-empty').style.display = 'none';

    state.orders.forEach(function (o) {
      var row = el('div', 'order');

      var main = el('div', 'order-main');
      main.appendChild(el('div', 'order-name', o.courseName || ('课程 ' + o.courseId)));
      main.appendChild(el('div', 'order-no', o.orderNo));
      row.appendChild(main);

      var badge = el('span', 'badge ' + (statusClass[o.status] || 'cancel'),
                     o.statusText || statusText[o.status] || '未知');
      row.appendChild(badge);

      if (o.status === 1) {
        var cancelBtn = el('button', 'btn-small', '退课');
        cancelBtn.addEventListener('click', function () { doCancel(o.courseId, cancelBtn); });
        row.appendChild(cancelBtn);
      } else if (o.status === 2 && o.failReason) {
        row.appendChild(el('span', 'order-no', o.failReason));
      }

      list.appendChild(row);
    });
  }

  function doCancel(courseId, btn) {
    btn.disabled = true;
    btn.textContent = '退课中…';
    api('/api/seckill/' + courseId + '/cancel', { method: 'POST' })
      .then(function () {
        toast('已退课，名额已释放', 'ok');
        loadOrders();
        loadCourses();
      })
      .catch(function (err) {
        toast(err.message, 'err');
        btn.disabled = false;
        btn.textContent = '退课';
      });
  }

  // ==================== 管理员 ====================
  $('admin-preheat').addEventListener('click', function () {
    var btn = this;
    btn.disabled = true;
    btn.textContent = '预热中…';
    api('/api/admin/cache/stock', { method: 'POST' })
      .then(function () { toast('全部课程库存已预热到 Redis', 'ok'); })
      .catch(function (err) { toast(err.message, 'err'); })
      .finally(function () {
        btn.disabled = false;
        btn.textContent = '预热全部库存';
      });
  });

  // ==================== 刷新按钮 ====================
  $('refresh-courses').addEventListener('click', loadCourses);
  $('refresh-orders').addEventListener('click', loadOrders);

  // ==================== 启动 ====================
  if (state.token) {
    enterApp();
  } else {
    $('login-view').style.display = 'flex';
  }

  // 学生停留在订单页时，每 3 秒刷新一次，能看到待处理 → 已成功的变化
  setInterval(function () {
    if (!state.token || state.role !== 'STUDENT') return;
    if ($('tab-orders').style.display === 'none') return;
    loadOrders();
  }, 3000);
})();
</script>
</body>
</html>
